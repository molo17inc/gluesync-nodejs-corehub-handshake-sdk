# GitLab CI/CD configuration for Gluesync Node.js SDK

default:
  tags:
    - gs-runners-hq

# Only run on develop branch merges
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
      when: always
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never

stages:
  - setup
  - lint
  - build
  - test

variables:
  NODE_VERSION: "20"

# Cache node_modules to speed up builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

# Setup job - install dependencies
setup:
  stage: setup
  image: node:${NODE_VERSION}-alpine
  script: |
    echo "Node.js version: $(node -v)"
    echo "npm version: $(npm -v)"
    npm ci
    echo "$GLUESYNC_LICENSE_CONTENT" > ./gs-license.dat
  artifacts:
    paths:
      - node_modules/
      - gs-license.dat

# Lint job - check code quality
lint:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  script: |
    npm run lint
  dependencies:
    - setup

# Build job - compile TypeScript to JavaScript
build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  script:
    - npm run build
  dependencies:
    - setup
  artifacts:
    paths:
      - dist/

# Test job - run Jest tests
test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  services:
    - name: molo17/gluesync-core-hub:latest
      alias: corehub
      variables:
        DOCKER_TLS_CERTDIR: ""
  variables:
    # Increase test timeout to allow for service startup
    JEST_TIMEOUT: 30000
  script:
    # Wait for CoreHub to be ready
    - apk add --no-cache curl
    - >-
      echo "Waiting for CoreHub to be ready..."
    - sleep 10
    # Run tests
    - npm test
  dependencies:
    - setup
    - build
