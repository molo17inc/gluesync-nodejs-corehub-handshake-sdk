# GitLab CI/CD configuration for Gluesync Node.js SDK

default:
  tags:
    - gs-runners-hq

# Only run on develop branch merges
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
      when: always
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never

stages:
  - setup
  - lint
  - build
  - test

variables:
  NODE_VERSION: "20"

# Cache node_modules to speed up builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

# Setup job - install dependencies
setup:
  stage: setup
  image: node:${NODE_VERSION}-alpine
  script: |
    echo "Node.js version: $(node -v)"
    echo "npm version: $(npm -v)"
    npm ci
    echo "$GLUESYNC_LICENSE_CONTENT" > ./gs-license.dat
  artifacts:
    paths:
      - node_modules/
      - gs-license.dat

# Lint job - check code quality
lint:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  script: |
    npm run lint
  dependencies:
    - setup

# Build job - compile TypeScript to JavaScript
build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  script:
    - npm run build
  dependencies:
    - setup
  artifacts:
    paths:
      - dist/

# Test job - run Jest tests
test:
  stage: test
  image: molo17/gluesync-core-hub:latest
  variables:
    # Increase test timeout to allow for service startup
    JEST_TIMEOUT: 30000
  script:
    # Install Node.js and npm (since this is based on gradle:8.8-jdk21)
    - apt-get update
    - apt-get install -y curl
    - curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
    - apt-get install -y nodejs
    - 'echo "Node.js version: $(node -v)"'
    - 'echo "npm version: $(npm -v)"'
    # Wait for CoreHub to be ready (it's already running in the same container)
    - echo "CoreHub is running in the same container"
    # Run tests
    - npm test
  dependencies:
    - setup
    - build
