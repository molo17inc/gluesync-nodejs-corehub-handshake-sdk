# GitLab CI/CD configuration for Gluesync Node.js SDK

default:
  tags:
    - gs-docker-performance-test

# Only run on develop branch merges
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
      when: always
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
    - when: never

stages:
  - setup
  - lint
  - build
  - test

variables:
  NODE_VERSION: "20"

# Cache node_modules to speed up builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

# Setup job - install dependencies
setup:
  stage: setup
  image: node:${NODE_VERSION}-alpine
  script: |
    echo "Node.js version: $(node -v)"
    echo "npm version: $(npm -v)"
    npm ci
    echo "$GLUESYNC_LICENSE_CONTENT" > ./gs-license.dat
  artifacts:
    paths:
      - node_modules/
      - gs-license.dat

# Lint job - check code quality
lint:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  script: |
    npm run lint
  dependencies:
    - setup

# Build job - compile TypeScript to JavaScript
build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  script:
    - npm run build
  dependencies:
    - setup
  artifacts:
    paths:
      - dist/

# Test job - run Jest tests
test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  script:
    - npm test
  dependencies:
    - setup
    - build
