# GitLab CI/CD configuration for Gluesync Node.js SDK

default:
  tags:
    - gs-runners-hq

# Only run on develop branch merges
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
      when: always
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never

stages:
  - setup
  - lint
  - build
  - test
  - integration-test

variables:
  NODE_VERSION: "20"
  CI: "true"
  JEST_TIMEOUT: "60000"

# Cache node_modules to speed up builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

# Setup job - install dependencies
setup:
  stage: setup
  image: node:${NODE_VERSION}-alpine
  script: |
    echo "Node.js version: $(node -v)"
    echo "npm version: $(npm -v)"
    npm ci
    echo "$GLUESYNC_LICENSE_CONTENT" > ./gs-license.dat
  artifacts:
    paths:
      - node_modules/
      - gs-license.dat

# Lint job - check code quality
lint:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  script: |
    npm run lint
  dependencies:
    - setup

# Build job - compile TypeScript to JavaScript
build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  script:
    - npm run build
  dependencies:
    - setup
  artifacts:
    paths:
      - dist/

# Unit test job - run Jest unit tests
test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  script:
    - echo "Running unit tests..."
    - npm run test:unit
  dependencies:
    - setup
    - build

# Integration test job - run tests with mocked CoreHub functionality
integration-test:
  stage: integration-test
  image: node:${NODE_VERSION}-alpine
  variables:
    # Increase test timeout for integration tests
    JEST_TIMEOUT: 60000
    # Set CI flag to true for test environment detection
    CI: "true"
  script:
    - echo "Running integration tests with mocked CoreHub functionality..."
    - npm run test:integration
  dependencies:
    - setup
    - build
